name: Daily Ronaldo Stats Sync & Auto-Deploy

on:
  schedule:
    # Every 30 minutes: poll the public scoreboards for a new Ronaldo goal.
    - cron: '*/30 * * * *'
  workflow_dispatch: # one-click manual run from the Actions tab

permissions:
  contents: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Refresh the freshness stamp
        run: node scripts/daily-date-sync.mjs

      - name: Poll the public scoreboards and stage any new match
        run: node scripts/auto-sync-matches.mjs

      - name: Cross-check the rival's published figures
        run: node scripts/auto-sync-messi.mjs --check || true

      - name: Rebuild the dataset and the dated goal calendar
        run: npm run build:data

      - name: Regenerate the localized pages
        run: npm run build:i18n

      - name: Build & run the verification audits
        run: |
          npm run build
          npm run audit
          npm run audit:i18n

      - name: Commit & push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          # The watcher logs and the staged-review file are ephemeral; they
          # must never be committed on their own.
          git checkout -- public/data/source-watch.json public/data/last-check.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(stats): daily Ronaldo stats & freshness sync [skip ci]"
            git push origin HEAD:${{ github.ref }}
            echo "Synced and pushed."
          else
            echo "All stats up to date. Nothing to commit."
          fi
