name: Daily Ronaldo Stats Scraper & Auto-Deploy

on:
  schedule:
    # Every 10 minutes, exactly like the Messi site's pipeline: a goal can be
    # scored at any moment and the site should know within the quarter hour.
    - cron: '*/10 * * * *'
  workflow_dispatch: # one-click manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-ronaldo-sync
  cancel-in-progress: true

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Scrapers & Auto-Sync
        run: |
          node scripts/daily-date-sync.mjs
          node scripts/auto-sync-matches.mjs
          node scripts/auto-sync-latest-goal.mjs
          node scripts/source-watch.mjs
          node scripts/auto-sync-ronaldo.mjs --check || true
          node scripts/fill-calendar-gaps.mjs || true

      - name: Refresh the goal video catalogue
        run: npm run fetch:seasons

      - name: Refresh the gear store
        # the product photographs, prices and ratings come from the listings
        # themselves, so they are read again on every run
        run: npm run fetch:gear

      - name: Rebuild the dataset and the dated goal calendar
        run: |
          npm run build:data
          npm run build:calendar
          npm run build:i18n

      - name: Build & Run Verification Audits
        run: |
          npm run build
          npm run audit
          npm run audit:i18n
          npm run verify:all

      - name: Commit & Push New Match Stats
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          # the watcher logs and the staged-review file are ephemeral; they must
          # never be committed on their own
          git checkout -- public/data/source-watch.json public/data/last-check.json public/data/pending.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(stats): daily Ronaldo stats, goal video & freshness sync [skip ci]"
            git push origin HEAD:${{ github.ref }}
            echo "Synced and pushed."
          else
            echo "All stats up to date. Nothing to commit."
          fi
