name: Daily Ronaldo Stats Sync & Auto-Deploy

on:
  schedule:
    # Every half hour: a goal can be scored at any moment and the site should
    # know within the half hour. A run that finds nothing new writes nothing,
    # so it costs no deployment.
    - cron: '*/30 * * * *'
  workflow_dispatch: # one-click manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-ronaldo-sync
  cancel-in-progress: true

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Scrapers & Auto-Sync
        # every one of these reads a public feed; a feed that is down must not
        # fail the run, it must only mean that nothing was learnt
        run: |
          node scripts/daily-date-sync.mjs
          node scripts/sync-dated-copy.mjs || true
          node scripts/auto-sync-matches.mjs || true
          node scripts/auto-sync-latest-goal.mjs || true
          node scripts/source-watch.mjs || true
          node scripts/auto-sync-ronaldo.mjs --check || true
          node scripts/fill-calendar-gaps.mjs || true

      - name: Refresh the goal video catalogue
        run: npm run fetch:seasons || true

      - name: Refresh the gear store
        # the product photographs, prices and ratings come from the listings
        # themselves, so they are read again on every run
        run: npm run fetch:gear || true

      - name: Rebuild the dataset and the pages
        run: |
          npm run build:data
          npm run build:calendar
          npm run build:i18n

      - name: Build & Run Verification Audits
        run: |
          npm run build
          npm run verify:all

      - name: Commit & Push New Match Stats
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          # the watcher logs and the staged-review file are ephemeral: they must
          # never be committed on their own
          git reset -q -- public/data/source-watch.json public/data/last-check.json public/data/pending.json
          if git diff --cached --quiet; then
            echo "Nothing changed. No commit, no deployment."
            exit 0
          fi
          git commit -m "chore(stats): refresh the Ronaldo stats, the goal videos and the gear store [skip ci]"
          # The branch can move while the run is working - a person pushing a
          # fix, or an earlier run that committed the same refreshed data. A
          # plain push is then rejected and the run fails with a push error:
          # a failure email for a run that did its job. The remote changes
          # are taken in first, so the push is a fast-forward, and the push
          # is retried a few times before the run gives up quietly - the
          # next run half an hour later carries the same refresh.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin ${{ github.ref_name }}; then
              if git push origin HEAD:${{ github.ref }}; then
                echo "Synced and pushed."
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "The branch moved (attempt $attempt); taking the remote changes in and trying again."
            sleep 5
          done
          echo "The branch kept moving; the refresh is left for the next run."
          exit 0
