<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>asset check</title>
<style>
 body{background:#f2f3f0;font:14px "Segoe UI",sans-serif;margin:0;padding:24px;color:#10130f}
 .row{display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap;margin-bottom:28px}
 .cell{text-align:center;background:#fff;border:1px solid #d3d6ce;padding:12px}
 .cell small{display:block;margin-top:8px;color:#5c6357;font-size:12px}
 img{display:block}
 .dark{background:#000}
</style></head><body>
<div class="row">
  <div class="cell"><img src="http://localhost:8899/logo-ronaldo.svg" width="260" height="260"><small>logo-ronaldo.svg</small></div>
  <div class="cell"><img src="http://localhost:8899/logo.png" width="260" height="260"><small>logo.png (raster)</small></div>
  <div class="cell"><img src="http://localhost:8899/logo-ronaldo-wordmark.svg" width="560"><small>logo-ronaldo-wordmark.svg</small></div>
</div>
<div class="row">
  <div class="cell"><img src="http://localhost:8899/favicon.svg" width="64" height="64"><small>favicon.svg</small></div>
  <div class="cell"><img src="http://localhost:8899/favicon.ico" width="64" height="64"><small>favicon.ico</small></div>
  <div class="cell"><img src="http://localhost:8899/favicon-32.png" width="32" height="32"><small>ico @32</small></div>
  <div class="cell dark"><img src="http://localhost:8899/favicon-192x192.png" width="120" height="120"><small style="color:#fff">app tile</small></div>
</div>
</body></html>
